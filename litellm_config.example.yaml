model_list:
  # ---------------------------------------------------------
  # MAIN MODELS (What you type in the terminal)
  # ---------------------------------------------------------
  - model_name: deepseek-v4-pro
    litellm_params:
      model: anthropic/deepseek-v4-pro
      api_base: https://api.deepseek.com/anthropic
      api_key: YOUR_DEEPSEEK_API_KEY
      drop_params: True

  - model_name: free-reader-model
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: http://localhost:11434
      num_ctx: 32768
      drop_params: True

  # ---------------------------------------------------------
  # ALIAS CATCHERS (To intercept Claude Code's hardcoded requests)
  # ---------------------------------------------------------

  # When Claude Code explicitly asks for Sonnet, route it to DeepSeek
  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: anthropic/deepseek-v4-pro
      api_base: https://api.deepseek.com/anthropic
      api_key: YOUR_DEEPSEEK_API_KEY
      drop_params: True

  # When Claude Code explicitly asks for Opus, route it to DeepSeek
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/deepseek-v4-pro
      api_base: https://api.deepseek.com/anthropic
      api_key: YOUR_DEEPSEEK_API_KEY
      drop_params: True

  # When Claude Code explicitly asks for Haiku (the subagent), route it to Gemma
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: http://localhost:11434
      num_ctx: 32768
      drop_params: True
